<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="container">

    <!-- GREETING -->
    <h2 id="welcomeUser" class="welcome-user"></h2>

    <div class="top-cards">

      <!-- CLOCK -->
      <div class="card">
        <h3>⏰ Current Time</h3>
        <h1 id="time"></h1>
        <p id="date"></p>
        <h2 id="greeting"></h2>

        <input type="text" id="nameInput" placeholder="Your name...">
        <button onclick="saveName()">Save</button>
      </div>

      <!-- TIMER -->
      <div class="card">
        <h3>🎯 Focus Timer</h3>
        <h1 id="timer">0:00</h1>

        <div class="btn-group">
          <button onclick="startTimer()">Start</button>
          <button onclick="stopTimer()">Stop</button>
          <button onclick="resetTimer()">Reset</button>
        </div>

        <input type="number" id="minutesInput" placeholder="Minutes">
        <button onclick="setTimer()">Set</button>
      </div>

    </div>

    <!-- TASK -->
    <div class="card">
      <h3>📝 Tasks</h3>

      <input type="text" id="taskInput" placeholder="what you want to do?">
      <button onclick="addTask()">+ Add</button>

      <ul id="taskList"></ul>
    </div>

    <!-- QUICK LINKS -->
    <div class="card">
      <h3>🔗 Quick Links</h3>

      <input type="text" id="linkName" placeholder="Name">
      <input type="text" id="linkURL" placeholder="URL">
      <button onclick="addLink()">✨ Add</button>

      <ul id="linkList"></ul>
    </div>

  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
