<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Flow</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1 id="helloText">Hello, User</h1>
        <p class="subheading">Welcome to your Personal Flow</p>
    </div>

    <!-- TOP CARDS -->
    <div class="top-cards">

        <!-- CLOCK -->
        <div class="card">
            <h3>⏰ Current Time</h3>

            <h1 id="time">00:00</h1>
            <p id="date"></p>

            <!-- GREETING -->
            <h2 id="greeting">🌅 Good Morning</h2>

            <!-- INPUT NAME -->
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="Your name...">
                <button onclick="saveName()">Save</button>
            </div>
        </div>

        <!-- TIMER -->
        <div class="card">
            <h3>🎯 Focus Timer</h3>

            <h1 id="timer">0:00</h1>

            <div class="timer-buttons">
                <button onclick="startTimer()">Start</button>
                <button onclick="stopTimer()">Stop</button>
                <button onclick="resetTimer()">Reset</button>
            </div>

            <div class="input-group">
                <input type="number" id="customTime" placeholder="Minutes">
                <button onclick="setCustomTime()">Set</button>
            </div>
        </div>

    </div>

    <!-- TASK -->
    <div class="card">
        <h2>📝 Tasks</h2>

        <div class="task-input-row">
            <input type="text" id="taskInput" placeholder="what you want to do?">
            <button onclick="addTask()">➕ Add</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <!-- LINKS -->
    <div class="card">
        <h2>🔗 Quick Links</h2>

        <div class="link-input-row">
            <input type="text" id="linkName" placeholder="Name">
            <input type="text" id="linkURL" placeholder="URL">
            <button onclick="addLink()">✨ Add</button>
        </div>

        <ul id="linkList"></ul>
    </div>

</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
